<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TrendScope | 토스페이먼츠 결제 테스트</title>
    <script src="https://js.tosspayments.com/v2/standard"></script>
    <style>
      body {
        margin: 0;
        font-family: Arial, "Noto Sans KR", sans-serif;
        background: #f5f7fb;
        color: #111827;
      }

      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 48px 20px 80px;
      }

      .card {
        background: #fff;
        border: 1px solid #dbe3f0;
        border-radius: 14px;
        padding: 28px;
        box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }

      p {
        margin: 0 0 24px;
        color: #64748b;
      }

      #payment-method,
      #agreement {
        margin-top: 18px;
      }

      #payment-button {
        width: 100%;
        margin-top: 30px;
        padding: 15px;
        border: 0;
        border-radius: 10px;
        background: #0050ff;
        color: #fff;
        cursor: pointer;
        font-size: 16px;
        font-weight: 800;
      }

      #payment-button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      #status {
        margin-top: 16px;
        font-size: 14px;
        color: #64748b;
      }

      a {
        display: inline-block;
        margin-bottom: 18px;
        color: #2563eb;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <a href="index.html">TrendScope로 돌아가기</a>
      <section class="card">
        <h1>토스페이먼츠 결제 테스트</h1>
        <p>심사용 결제창 확인을 위한 테스트 페이지입니다. 결제 금액은 15,000원으로 설정되어 있습니다.</p>

        <div id="payment-method"></div>
        <div id="agreement"></div>

        <button id="payment-button" type="button">결제하기</button>
        <div id="status">결제위젯을 불러오는 중입니다.</div>
      </section>
    </main>

    <script>
      const clientKey = "test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm";
      const amount = 15000;
      const orderPrefix = "test_order";

      async function main() {
        const button = document.getElementById("payment-button");
        const status = document.getElementById("status");

        const tossPayments = TossPayments(clientKey);
        const widgets = tossPayments.widgets({ customerKey: "ANONYMOUS" });

        await widgets.setAmount({ currency: "KRW", value: amount });

        await Promise.all([
          widgets.renderPaymentMethods({
            selector: "#payment-method",
            variantKey: "DEFAULT",
          }),
          widgets.renderAgreement({
            selector: "#agreement",
            variantKey: "DEFAULT",
          }),
        ]);

        status.textContent = "결제수단을 선택한 뒤 결제하기를 눌러주세요.";

        button.addEventListener("click", async () => {
          button.disabled = true;
          status.textContent = "토스 결제창을 여는 중입니다.";
          try {
            const orderId = `${orderPrefix}_${Date.now()}_${Math.random().toString(36).slice(2, 10)}`;
            await widgets.requestPayment({
              orderId,
              orderName: "TrendScope 결제 테스트",
              successUrl: `${window.location.origin}/success.html?testCheckout=1`,
              failUrl: `${window.location.origin}/fail.html`,
            });
          } catch (error) {
            status.textContent = error.message || "결제창을 열지 못했습니다.";
            button.disabled = false;
          }
        });
      }

      main().catch((error) => {
        document.getElementById("status").textContent = error.message || "결제위젯 초기화에 실패했습니다.";
      });
    </script>
  </body>
</html>
