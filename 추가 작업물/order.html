<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TrendScope | NICEPAY Billing</title>
    <style>
      :root {
        --blue: #2563eb;
        --ink: #101828;
        --muted: #667085;
        --line: #d9e4ff;
        --bg: #f4f6f9;
        --paper: #fff;
        --green: #16a34a;
        --red: #dc2626;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Arial, "Noto Sans KR", sans-serif;
      }
      a { color: inherit; text-decoration: none; }
      .nav {
        border-bottom: 1px solid #e6eaf2;
        background: #fff;
      }
      .nav-inner {
        width: min(760px, calc(100% - 28px));
        min-height: 58px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand { font-size: 22px; font-weight: 950; }
      .back { color: var(--blue); font-size: 13px; font-weight: 900; }
      main {
        width: min(760px, calc(100% - 28px));
        margin: 0 auto;
        padding: 34px 0 60px;
      }
      .eyebrow {
        margin: 0 0 8px;
        color: var(--blue);
        font-size: 12px;
        font-weight: 950;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 10px;
        font-size: clamp(32px, 5vw, 48px);
        line-height: 1.06;
      }
      .lead {
        margin: 0 0 18px;
        color: var(--muted);
        line-height: 1.65;
      }
      .card {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.05);
        overflow: hidden;
      }
      .price {
        padding: 22px;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(180deg, #f8fbff, #fff);
      }
      .price span {
        display: block;
        margin-bottom: 8px;
        color: var(--blue);
        font-size: 12px;
        font-weight: 950;
        text-transform: uppercase;
      }
      .price strong { display: block; font-size: 40px; }
      .price small { color: var(--muted); font-size: 15px; }
      form {
        display: grid;
        gap: 12px;
        padding: 22px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 900;
      }
      input {
        width: 100%;
        min-height: 42px;
        padding: 0 12px;
        border: 1px solid #d7ddea;
        border-radius: 6px;
        background: #fff;
        color: var(--ink);
        font: inherit;
        outline: 0;
      }
      button {
        min-height: 46px;
        border: 1px solid var(--blue);
        border-radius: 6px;
        background: var(--blue);
        color: #fff;
        font-weight: 950;
        cursor: pointer;
      }
      button.secondary {
        border-color: #d7ddea;
        background: #fff;
        color: var(--blue);
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }
      .notice {
        margin: 0 22px 20px;
        padding: 13px;
        border: 1px solid #e6eaf2;
        border-radius: 6px;
        background: #f8fafc;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
      }
      .policy-links {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 16px;
        margin: 18px 0 0;
        color: var(--muted);
        font-size: 12px;
      }
      .result {
        white-space: pre-wrap;
        margin: 0;
        padding: 14px;
        border-radius: 6px;
        background: #0b1220;
        color: #e5e7eb;
        font-size: 12px;
        line-height: 1.55;
        overflow: auto;
      }
      .ok { color: var(--green); }
      .bad { color: var(--red); }
      @media (max-width: 640px) {
        .grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header class="nav">
      <div class="nav-inner">
        <a class="brand" href="index.html#products">TrendScope</a>
        <a class="back" href="index.html#subscribe">돌아가기</a>
      </div>
    </header>

    <main>
      <p class="eyebrow">NICEPAY billing test</p>
      <h1>정기결제 카드 등록</h1>
      <p class="lead">테스트 모드에서 카드를 등록해 빌키를 발급하고, 발급된 빌키로 29,800원 테스트 승인을 요청합니다.</p>

      <section class="card">
        <div class="price">
          <span>TrendScope Membership</span>
          <strong>29,800원 <small>/ 월</small></strong>
        </div>

        <form id="billingForm">
          <div class="grid">
            <label>이름
              <input name="buyerName" autocomplete="name" value="김주혁" />
            </label>
            <label>이메일
              <input name="buyerEmail" type="email" autocomplete="email" value="juhyukkim0612@gmail.com" />
            </label>
          </div>

          <label>휴대폰 번호
            <input name="buyerTel" inputmode="numeric" autocomplete="tel" placeholder="01067779782" />
          </label>

          <label>카드번호
            <input name="cardNo" inputmode="numeric" autocomplete="cc-number" placeholder="숫자만 입력" required />
          </label>

          <div class="grid">
            <label>유효기간 년도(YY)
              <input name="expYear" inputmode="numeric" autocomplete="cc-exp-year" maxlength="2" placeholder="29" required />
            </label>
            <label>유효기간 월(MM)
              <input name="expMonth" inputmode="numeric" autocomplete="cc-exp-month" maxlength="2" placeholder="12" required />
            </label>
          </div>

          <div class="grid">
            <label>생년월일 6자리 또는 사업자번호 10자리
              <input name="idNo" inputmode="numeric" placeholder="901201" required />
            </label>
            <label>카드 비밀번호 앞 2자리
              <input name="cardPw" inputmode="numeric" maxlength="2" type="password" required />
            </label>
          </div>

          <button id="registerButton" type="submit">카드 등록하고 빌키 발급</button>
          <button id="payButton" class="secondary" type="button" disabled>발급된 빌키로 29,800원 테스트 승인</button>
          <pre id="result" class="result">대기 중...</pre>
        </form>

        <p class="notice">
          카드번호와 비밀번호는 저장하지 않고 서버에서 즉시 암호화해 나이스페이 API로 전달합니다.
          발급된 빌키만 테스트 기록으로 저장됩니다. 실제 운영에서는 HTTPS 서버와 DB 저장 구조가 필요합니다.
        </p>
      </section>

      <nav class="policy-links" aria-label="정책 문서">
        <a href="terms.html">이용약관</a>
        <a href="privacy.html">개인정보처리방침</a>
        <a href="refund.html">환불정책</a>
      </nav>
    </main>

    <script>
      const form = document.querySelector("#billingForm");
      const result = document.querySelector("#result");
      const registerButton = document.querySelector("#registerButton");
      const payButton = document.querySelector("#payButton");
      let currentBid = "";

      function show(payload, ok = true) {
        result.className = `result ${ok ? "ok" : "bad"}`;
        result.textContent = typeof payload === "string" ? payload : JSON.stringify(payload, null, 2);
      }

      function formPayload() {
        return Object.fromEntries(new FormData(form).entries());
      }

      async function postJson(url, payload) {
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await response.json();
        if (!response.ok || data.ok === false) {
          const error = new Error(data.error || data.nicepay?.resultMsg || data.nicepay?.ResultMsg || "요청 실패");
          error.data = data;
          throw error;
        }
        return data;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        registerButton.disabled = true;
        payButton.disabled = true;
        show("빌키 발급 요청 중...");
        try {
          const data = await postJson("/api/nicepay/billing/register", formPayload());
          currentBid = data.billing?.bid || "";
          payButton.disabled = !currentBid;
          show(data, Boolean(currentBid));
        } catch (error) {
          show(error.data || error.message, false);
        } finally {
          registerButton.disabled = false;
        }
      });

      payButton.addEventListener("click", async () => {
        if (!currentBid) return;
        payButton.disabled = true;
        show("테스트 승인 요청 중...");
        try {
          const payload = formPayload();
          const data = await postJson("/api/nicepay/billing/pay", {
            bid: currentBid,
            amount: 29800,
            goodsName: "TrendScope Membership",
            buyerName: payload.buyerName,
            buyerEmail: payload.buyerEmail,
            buyerTel: payload.buyerTel,
          });
          show(data, data.ok);
        } catch (error) {
          show(error.data || error.message, false);
        } finally {
          payButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
