<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TrendScope | 결제 실패</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, "Noto Sans KR", sans-serif;
        text-align: center;
        padding: 50px 16px;
        background: #f8fafc;
        color: #111827;
      }

      .box {
        display: inline-block;
        max-width: 520px;
        padding: 30px;
        border: 1px solid #ffcccc;
        border-radius: 10px;
        background: #fff5f5;
      }

      a {
        color: #0077ff;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>결제가 실패했습니다.</h1>
      <p id="error-message">알 수 없는 오류가 발생했습니다.</p>
      <p style="color: #666">에러 코드: <span id="error-code"></span></p>
      <a href="./#subscribe">다시 결제하기</a>
    </div>

    <script>
      const urlParams = new URLSearchParams(window.location.search);
      document.getElementById("error-message").textContent =
        urlParams.get("message") || "알 수 없는 오류가 발생했습니다.";
      document.getElementById("error-code").textContent = urlParams.get("code") || "-";
    </script>
  </body>
</html>
