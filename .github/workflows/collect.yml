name: Periodic Data Collection

on:
  # 하루 4회 — KST 06:00 / 12:00 / 18:00 / 00:00 (= UTC 21 / 03 / 09 / 15)
  schedule:
    - cron: '0 21 * * *'  # 06:00 KST
    - cron: '0 3 * * *'   # 12:00 KST
    - cron: '0 9 * * *'   # 18:00 KST
    - cron: '0 15 * * *'  # 00:00 KST

  # Allow manual trigger
  workflow_dispatch:

env:
  APP_URL: ${{ secrets.APP_URL }}
  COLLECT_API_KEY: ${{ secrets.COLLECT_API_KEY }}

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Data Collection
        run: |
          echo "Starting data collection..."

          response=$(curl -s -w "\n%{http_code}" -X POST "$APP_URL/api/collect" \
            -H "Authorization: Bearer $COLLECT_API_KEY" \
            -H "Content-Type: application/json")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response: $body"
          echo "HTTP Code: $http_code"

          if [ "$http_code" -ne 200 ]; then
            echo "Collection failed with status $http_code"
            exit 1
          fi

          echo "Collection completed successfully!"

      - name: Send Notification (Optional)
        if: failure()
        run: |
          echo "Data collection failed! Check the logs."
          # Add Slack/Discord notification here if needed
